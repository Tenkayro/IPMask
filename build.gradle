plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version '2.+'
	id 'maven-publish'
}

version = providers.gradleProperty('releaseVersion').getOrElse(project.version.toString())

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"ipmask" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

modrinth {
	token = providers.environmentVariable('MODRINTH_TOKEN').orNull
	projectId = project.modrinth_project_id
	versionNumber = project.provider { "mc${project.minecraft_version}-${project.version}-fabric" }
	versionName = project.provider { "IPMask ${project.version} for Fabric ${project.minecraft_version}" }
	versionType = 'release'
	uploadFile = tasks.named('jar')
	gameVersions = [project.minecraft_version]
	loaders = ['fabric']
	changelog = providers.provider {
		def releaseNotes = rootProject.file('build/release-notes.md')
		releaseNotes.isFile() ? releaseNotes.getText('UTF-8') : ''
	}

	dependencies {
		required.project 'fabric-api'
		optional.project 'modmenu'
	}
}

if (project.hasProperty('withModMenu')) {
	dependencies.add('runtimeOnly', "com.terraformersmc:modmenu:${modmenu_version}")
}

processResources {
	def metadata = [
		version: project.version,
		minecraft_version: project.minecraft_version,
		loader_version: project.loader_version,
		fabric_api_version: project.fabric_api_version,
		java_version: project.java_version,
		modmenu_version: project.modmenu_version
	]
	inputs.properties metadata

	filesMatching('fabric.mod.json') {
		expand metadata
	}
}

def mixinJavaVersion = project.java_version.toString()
tasks.named('processClientResources') {
	inputs.property('java_version', mixinJavaVersion)
	filesMatching('ipmask.client.mixins.json') {
		expand(java_version: mixinJavaVersion)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = project.java_version.toInteger()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
	}
	sourceCompatibility = JavaVersion.toVersion(project.java_version.toInteger())
	targetCompatibility = JavaVersion.toVersion(project.java_version.toInteger())
	withSourcesJar()
}

tasks.withType(Jar).configureEach {
	destinationDirectory = layout.projectDirectory.dir('.dist')
}

def modArtifactName = project.name

jar {
	from('LICENSE') {
		rename { "${it}_${modArtifactName}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}
